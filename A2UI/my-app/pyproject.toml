[project]
name = "my-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "a2ui-agent-sdk",
    "a2ui-core",
    "langchain>=1.4.4",
    "langchain-anthropic>=1.7.5",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.7.0",
    "python-dotenv>=1.2.4",
]

[tool.uv.sources]
a2ui-core = { path = "../a2ui/python/a2ui_core", editable = true }
a2ui-agent-sdk = { path = "../a2ui/python/a2ui_agent", editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.1",
]
